services:

  cloud-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: cloud-gateway
    hostname: cloud-gw
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      cloud-net:
        ipv4_address: 10.0.0.1
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped

  cloud-server:
    image: alpine:latest
    container_name: cloud-server
    hostname: cloud-server
    networks:
      cloud-net:
        ipv4_address: 10.0.0.10
    command: >
      sh -c "
        apk add --no-cache iputils iproute2 curl &&
        ip route add 192.168.1.0/24 via 10.0.0.1 &&
        echo 'Cloud Server ready.' &&
        tail -f /dev/null
      "
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      - cloud-gateway

  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    hostname: localstack
    networks:
      cloud-net:
        ipv4_address: 10.0.0.20
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,sqs,sns,dynamodb
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOCALSTACK_AUTH_TOKEN=
    restart: unless-stopped

networks:
  cloud-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254